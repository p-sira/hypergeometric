[package]
name = "hypergeometric"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Sira Pornsiriprasert <code@psira.me>"]
documentation = "https://docs.rs/hypergeometric"
homepage = "https://github.com/p-sira/hypergeometric"
repository = "https://github.com/p-sira/hypergeometric"
license = "BSD-3-Clause"

description = "Real hypergeometric and Wright special functions in pure Rust"
readme = "README.md"
keywords = ["hypergeometric", "wright", "special-functions", "numerics", "math"]
categories = ["mathematics", "science"]
include = ["src/**", "LICENSE", "LICENSES/**"]

[dependencies]
bessel = { version = "0.1.0" }
num-traits = "0.2"

[dev-dependencies]
divan = { version = "6.0.0", package = "codspeed-divan-compat" }

[[bench]]
name = "hypergeometric"
harness = false
